name: Namleh data backup

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to back up
        required: true
        type: choice
        options: [both, staging, production]
        default: both
      cadence:
        description: Backup cadence
        required: true
        type: choice
        options: [daily, monthly]
        default: daily

permissions:
  contents: read

concurrency:
  group: namleh-data-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-validation:
    if: github.repository == 'Namleh-Studios/buzz'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install PostgreSQL and R2 clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client jq
          aws --version

      - name: Load credentials from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21 # v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            45f8101d-c5bf-42cb-88c9-b466002268bf > CLOUDFLARE_NAMLEH_ACCOUNT_ID
            e5b23162-c574-450d-a27f-b4ab00e811bb > BUZZ_STAGING_BACKUP_DATABASE_URL
            2363c745-3a33-4cb9-84cd-b4ab00dea4fe > BUZZ_STAGING_MIGRATION_DATABASE_URL
            00923eb1-24cb-43d9-bfcf-b4ab00dee5aa > BUZZ_STAGING_BACKUP_R2_ACCESS_KEY_ID
            bbc3e8a5-0645-4661-9073-b4ab00dee5e2 > BUZZ_STAGING_BACKUP_R2_SECRET_ACCESS_KEY
            e07d147c-3f21-4897-a94d-b4ab00e815f9 > BUZZ_PRODUCTION_BACKUP_DATABASE_URL
            d363568e-ae69-4ad6-b895-b4ab00dea8ec > BUZZ_PRODUCTION_MIGRATION_DATABASE_URL
            e7e49440-d97d-49b4-8293-b4ab00dee860 > BUZZ_PRODUCTION_BACKUP_R2_ACCESS_KEY_ID
            03dec605-7fe4-41c1-9b4b-b4ab00dee8a3 > BUZZ_PRODUCTION_BACKUP_R2_SECRET_ACCESS_KEY
            f0208eef-2c71-4a2a-9d1b-b4ab00e1ca76 > BUZZ_RESTORE_VALIDATION_DATABASE_URL
            b7f465a0-9da7-4ed1-bb0b-b4660021eb73 > NEON_API_KEY

      - name: Back up and restore-check selected environments
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected_environment="${{ inputs.environment }}"
            cadence="${{ inputs.cadence }}"
          else
            selected_environment=both
            cadence=daily
          fi

          if [[ "$selected_environment" == "both" ]]; then
            environments=(staging production)
          else
            environments=("$selected_environment")
          fi

          for environment in "${environments[@]}"; do
            scripts/namleh-data-backup.sh "$environment" "$cadence"
            scripts/namleh-data-restore-validate.sh "$environment" "$cadence"
            scripts/namleh-neon-usage-check.sh "$environment"
            if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%d)" == "01" ]]; then
              scripts/namleh-data-backup.sh "$environment" monthly
            fi
          done
