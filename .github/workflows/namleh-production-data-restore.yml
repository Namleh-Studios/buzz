name: Namleh production data restore

on:
  workflow_dispatch:
    inputs:
      cadence:
        description: Backup cadence containing the selected object
        required: true
        type: choice
        options: [daily, monthly]
      backup_key:
        description: Exact R2 database.dump object key
        required: true
        type: string
      confirmation:
        description: Type RESTORE PRODUCTION DATA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: namleh-production-data-restore
  cancel-in-progress: false

jobs:
  restore:
    if: >-
      github.repository == 'Namleh-Studios/buzz' &&
      inputs.confirmation == 'RESTORE PRODUCTION DATA'
    environment: production
    runs-on: [self-hosted, linux, home-lab, docker]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare PostgreSQL and R2 clients
        run: |
          client_bin="$(scripts/setup-namleh-data-clients.sh)"
          echo "$client_bin" >> "$GITHUB_PATH"
          "$client_bin/pg_restore" --version
          "$client_bin/aws" --version
          jq --version

      - name: Load credentials from Bitwarden Secrets Manager
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          secrets_json="$(
            docker run --rm \
              --env BWS_ACCESS_TOKEN \
              ghcr.io/bitwarden/bws:2.1.0@sha256:3927158c53ac5a17d6cbe59fc3e1353e426f168bf246dbfe3668f6de5eaa107f \
              secret list
          )"
          while read -r secret_id environment_name; do
            value="$(jq -er --arg id "$secret_id" '
              [.[] | select(.id == $id)]
              | if length == 1 then .[0].value else error("secret lookup failed") end
            ' <<< "$secrets_json")"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$environment_name" "$value" >> "$GITHUB_ENV"
          done <<'SECRETS'
          45f8101d-c5bf-42cb-88c9-b466002268bf CLOUDFLARE_NAMLEH_ACCOUNT_ID
          d363568e-ae69-4ad6-b895-b4ab00dea8ec BUZZ_PRODUCTION_MIGRATION_DATABASE_URL
          e7e49440-d97d-49b4-8293-b4ab00dee860 BUZZ_PRODUCTION_BACKUP_R2_ACCESS_KEY_ID
          03dec605-7fe4-41c1-9b4b-b4ab00dee8a3 BUZZ_PRODUCTION_BACKUP_R2_SECRET_ACCESS_KEY
          SECRETS
          unset secrets_json value

      - name: Restore selected production backup
        env:
          TMPDIR: ${{ runner.temp }}
          NAMLEH_PRODUCTION_RESTORE_CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_RESTORE_BACKUP_KEY: ${{ inputs.backup_key }}
        run: >-
          scripts/namleh-data-restore-validate.sh
          production
          "${{ inputs.cadence }}"
          production
